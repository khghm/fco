name: CI

# BR-1 گام ۱۰: پنج مرحله lint / typecheck / test / migration / build.
# همان اسکریپتی اجرا می‌شود که محلی هم اجرا می‌شود (scripts/ci.sh) تا شاهد
# محلی و CI یکی باشند. E2Eهای HTTP فروشگاه و پنل در jobهای جدا اجرا می‌شوند.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fco
          POSTGRES_PASSWORD: fco
          POSTGRES_DB: fco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fco -d fco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: fco
      PGPASSWORD: fco
      POSTGRES_USER: fco
      POSTGRES_DB: fco
      PSQL: psql
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: fco-media
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint (docs audit, shell syntax, whitespace)
        run: bash scripts/ci.sh lint

      - name: Typecheck (migrations compile, schema API surface)
        run: bash scripts/ci.sh typecheck

      - name: Test (database negative suites)
        run: bash scripts/ci.sh test

      - name: Migration (up/idempotency/verify/down all/up)
        run: bash scripts/ci.sh migration

      - name: Build (schema bundle + manifest, verified on a fresh DB)
        run: bash scripts/ci.sh build

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: fco-schema
          path: |
            dist/fco-schema.sql
            dist/manifest.json

      - name: Show failure summary
        if: failure()
        run: echo "::error::CI قرمز شد — همان مرحله را محلی با bash scripts/ci.sh <stage> اجرا کنید."

  catalog-e2e:
    name: Storefront catalog HTTP E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fco
          POSTGRES_PASSWORD: fco
          POSTGRES_DB: fco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fco -d fco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: fco
      PGPASSWORD: fco
      POSTGRES_USER: fco
      POSTGRES_DB: fco
      PSQL: psql
      DATABASE_URL: postgresql://fco:fco@127.0.0.1:5432/fco

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node workspaces
        run: npm ci

      - name: Start Redis for E2E
        run: |
          docker run -d --name fco-e2e-redis -p 6379:6379 redis:7-alpine

      - name: Migrate, seed, build and verify storefront HTTP, media and rate limit
        run: bash scripts/catalog-e2e.sh

  admin-api-e2e:
    name: Admin API HTTP E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fco
          POSTGRES_PASSWORD: fco
          POSTGRES_DB: fco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fco -d fco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: fco
      PGPASSWORD: fco
      POSTGRES_USER: fco
      POSTGRES_DB: fco
      PSQL: psql
      DATABASE_URL: postgresql://fco:fco@127.0.0.1:5432/fco
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node workspaces
        run: npm ci

      - name: Migrate, seed, build and verify authenticated admin HTTP flows
        run: bash scripts/admin-api-e2e.sh
